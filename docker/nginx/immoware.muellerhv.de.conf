# Immoware Hub, nginx im Container "web".
# TLS wird NICHT hier terminiert. Ein vorgelagerter Reverse Proxy (z. B. Traefik, Caddy, HAProxy oder
# ein nginx auf dem Host) terminiert https://immoware.muellerhv.de und reicht Klartext-HTTP an Port 8080
# weiter. Er MUSS X-Forwarded-Proto und X-Forwarded-For setzen. Hinweis: bootstrap/app.php registriert noch kein
# trustProxies (offener Punkt, siehe docs/operations/01-deployment.md); bis dahin setzt diese Konfiguration HTTPS
# fuer php-fpm anhand von X-Forwarded-Proto.

upstream immoware_fpm {
    server app:9000;
    keepalive 8;
}

map $http_x_forwarded_proto $hub_scheme {
    default $scheme;
    https   https;
}

map $hub_scheme $hub_https {
    default "";
    https   on;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name immoware.muellerhv.de;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 34m;
    client_body_timeout 60s;

    # Sicherheitsheader (HSTS setzt der TLS-Proxy)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Correlation-ID der App durchreichen
    proxy_hide_header X-Powered-By;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Health-Endpunkte ohne Zugriffslog (Monitoring pollt haeufig)
    location ~ ^/(health|up)(/|$) {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # php-fpm Status nur aus dem Container-Netz
    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass immoware_fpm;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $hub_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $hub_scheme;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_pass immoware_fpm;
    }

    # Keine Auslieferung versteckter Dateien und von Storage
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage|vendor)/ { deny all; }
}
