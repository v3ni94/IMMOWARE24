# Immoware Hub, Mail- und Vorgangsbearbeitung: zweiter Server-Block im Container "web" (docs/mail/09-deployment.md).
# TLS terminiert der vorgelagerte Proxy fuer beide Hostnamen (immoware.muellerhv.de, mail.muellerhv.de) und reicht
# Klartext-HTTP an Port 8080 mit X-Forwarded-Proto und X-Forwarded-For. Upstream und die Maps hub_scheme/hub_https
# sind in immoware.muellerhv.de.conf (default.conf) definiert und gelten hier mit.
# Kein MX, kein SPF, kein DKIM, kein DMARC fuer diesen Hostnamen: Gmail bleibt das Mailsystem.

server {
    listen 8080;
    server_name mail.muellerhv.de mail-staging.muellerhv.de;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: cid:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    proxy_hide_header X-Powered-By;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location ~ ^/(health|up)(/|$) {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Pub/Sub-Push: nur POST, Pfad-Token nicht loggen, JWT-Pruefung in der Anwendung (mail.push.auth).
    location ^~ /mail/gmail/push {
        access_log off;
        limit_except POST { deny all; }
        try_files /index.php?$query_string /index.php?$query_string;
    }

    # Keine Pfad-Allowlist in nginx: die Mail-Oberflaeche liegt an der Wurzel des Hosts (/, /cases, /approvals, /admin
    # als Mail-Verwaltung). Die Pfadtrennung erzwingt die Anwendung: auf diesem Host liefern alle Routen ohne
    # Domainbindung (Hub-Admin, /api) 404, ausgenommen Anmeldung, 2FA, Sicherheitsseiten, Health
    # (MailServiceProvider::registerHostGuard, docs/mail/09-deployment.md Abschnitt 3).
    location ~* ^/api(/|$) { return 404; }
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $hub_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $hub_scheme;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        set $immoware_fpm app:9000;
        fastcgi_pass $immoware_fpm;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage|vendor)/ { deny all; }
}
