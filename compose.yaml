# Immoware Hub, Docker Compose (Produktion oder Staging).
# Keine Secrets in dieser Datei: alle Werte kommen aus der .env neben compose.yaml (nicht im Repository)
# oder aus dem Secret-Store des Hosts. TLS terminiert ein vorgelagerter Proxy und reicht HTTP an web:8080.
#
# Start:      docker compose up -d --build
# Migration:  docker compose run --rm app php artisan migrate --force
# Doctor:     docker compose exec app php artisan hub:doctor

name: immoware-hub

x-app-base: &app-base
    build:
        context: .
        dockerfile: Dockerfile
    image: immoware-hub:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
        - .env
    environment:
        APP_ENV: ${APP_ENV:-production}
        APP_DEBUG: "false"
        APP_URL: ${APP_URL:-https://immoware.muellerhv.de}
        LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
        DB_CONNECTION: mariadb
        DB_HOST: mariadb
        DB_PORT: "3306"
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        QUEUE_CONNECTION: redis
        CACHE_STORE: redis
        SESSION_DRIVER: redis
    volumes:
        - storage:/var/www/html/storage
        - imports:/var/www/html/storage/app/imports
    depends_on:
        mariadb:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - backend
    logging:
        driver: json-file
        options:
            max-size: "20m"
            max-file: "5"

services:
    app:
        <<: *app-base
        container_name: immoware-hub-app
        command: ["php-fpm"]
        healthcheck:
            test: ["CMD", "php", "-r", "exit((int) !@fsockopen('127.0.0.1', 9000));"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

    web:
        image: nginx:1.27-alpine
        container_name: immoware-hub-web
        restart: unless-stopped
        depends_on:
            app:
                condition: service_healthy
                # web neu starten, wenn app neu erzeugt wird (neues Image). Zusaetzlich loest nginx den Namen app
                # per Docker-DNS zur Laufzeit auf (docker/nginx/*.conf, resolver 127.0.0.11).
                restart: true
        ports:
            # Nur lokal binden; der TLS-Proxy auf dem Host greift auf 127.0.0.1:8080 zu.
            - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
        volumes:
            - ./docker/nginx/immoware.muellerhv.de.conf:/etc/nginx/conf.d/default.conf:ro
            # Mail- und Vorgangsbearbeitung (docs/mail/09-deployment.md): eigener Server-Block fuer mail.muellerhv.de,
            # gleiche Anwendung, gleiches php-fpm. Der TLS-Proxy reicht beide Hostnamen an Port 8080 durch.
            - ./docker/nginx/mail.muellerhv.de.conf:/etc/nginx/conf.d/mail.conf:ro
            - ./public:/var/www/html/public:ro
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/up"]
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - backend
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"

    worker:
        <<: *app-base
        container_name: immoware-hub-worker
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=high,default,sync,write,documents,low
            - --sleep=3
            - --tries=1
            - --max-time=3600
            - --memory=256
            - --timeout=1800
        # Healthcheck (Aenderungsvermerk 12.09.2026): queue:monitor endet immer mit Exit 0 und prueft den Worker-Prozess
        # nicht. Der Scheduler stellt minuetlich (hub:worker:heartbeat) den WorkerHeartbeatJob auf die Queue high,
        # der storage/framework/worker-heartbeat schreibt (docs/operations/03-monitoring.md Abschnitt 5). Der
        # Healthcheck prueft das Alter der Datei (unhealthy ab 180 s, Exit 1), restart startet den Worker neu.
        # Voraussetzung: storage ist ein gemeinsames Volume von Scheduler und Worker.
        healthcheck:
            test: ["CMD", "php", "artisan", "hub:heartbeat:check", "worker", "--max-age=180"]
            interval: 60s
            timeout: 20s
            retries: 3
            start_period: 30s
        deploy:
            replicas: 1

    # Mail- und Vorgangsbearbeitung (docs/mail/09-deployment.md Abschnitt 4): eigener Prozess nur fuer mail-high, damit
    # Notfalleskalation (EmergencyAlertJob), SLA-Pruefung (SlaCheckJob) und freigegebene Aktionen (ExecuteActionJob) nie
    # hinter einem Massenimport (mail-sync) oder KI-Aufrufen (mail-ai) warten. Healthcheck wie beim Hub-Worker ueber das
    # Healthcheck je Prozess (pgrep), nicht ueber den gemeinsamen Worker-Heartbeat der Queue high: der wuerde bei einem
    # haengenden Mail-Worker gruen bleiben und bei Ausfall des Hub-Workers gesunde Mail-Worker neu starten (docs/mail/09).
    mail-worker-high:
        <<: *app-base
        container_name: immoware-hub-mail-worker-high
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=${MAIL_QUEUE_HIGH:-mail-high}
            - --sleep=1
            - --tries=1
            - --max-time=3600
            - --memory=256
            - --timeout=300
        # Prozess-Healthcheck: der Worker-Heartbeat (WorkerHeartbeatJob) laeuft auf der Queue high des Hub-Workers und
        # sagt nichts ueber diesen Prozess aus. Gepruft wird der eigene queue:work-Prozess mit seiner Queue-Liste.
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work redis --queue=${MAIL_QUEUE_HIGH:-mail-high}' >/dev/null"]
            interval: 60s
            timeout: 20s
            retries: 3
            start_period: 30s
        deploy:
            replicas: 1

    # Zweiter Mail-Worker fuer Import und Abgleich (mail-sync) sowie KI-Vorschlaege (mail-ai). Reihenfolge = Prioritaet.
    mail-worker:
        <<: *app-base
        container_name: immoware-hub-mail-worker
        command:
            - php
            - artisan
            - queue:work
            - redis
            - --queue=${MAIL_QUEUE_SYNC:-mail-sync},${MAIL_QUEUE_AI:-mail-ai}
            - --sleep=3
            - --tries=1
            - --max-time=3600
            - --memory=256
            - --timeout=600
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f 'queue:work redis --queue=${MAIL_QUEUE_SYNC:-mail-sync},${MAIL_QUEUE_AI:-mail-ai}' >/dev/null"]
            interval: 60s
            timeout: 20s
            retries: 3
            start_period: 30s
        deploy:
            replicas: 1

    scheduler:
        <<: *app-base
        container_name: immoware-hub-scheduler
        command: ["php", "artisan", "schedule:work", "--no-ansi"]
        # hub:worker:heartbeat schreibt minuetlich storage/framework/scheduler-heartbeat; der Healthcheck prueft das
        # Alter (unhealthy ab 180 s). schedule:list allein beweist nicht, dass schedule:work laeuft.
        healthcheck:
            test: ["CMD", "php", "artisan", "hub:heartbeat:check", "scheduler", "--max-age=180"]
            interval: 60s
            timeout: 20s
            retries: 3
            start_period: 30s

    mariadb:
        image: mariadb:11.4
        container_name: immoware-hub-mariadb
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --innodb-buffer-pool-size=512M
            - --log-bin=mariadb-bin
            - --binlog-format=ROW
            - --expire-logs-days=7
            # Integritaetstrigger (HUB_DB_TRIGGERS, Migration 2026_09_12_130000) legt der Anwendungsnutzer ohne SUPER an;
            # mit aktivem Binlog verlangt MariaDB dafuer log_bin_trust_function_creators (wie Host-Variante).
            - --log-bin-trust-function-creators=1
            - --max-connections=200
        environment:
            MARIADB_DATABASE: ${DB_DATABASE:-immoware_hub}
            MARIADB_USER: ${DB_USERNAME:?DB_USERNAME fehlt in .env}
            MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD fehlt in .env}
            MARIADB_AUTO_UPGRADE: "1"
            TZ: UTC
        volumes:
            - mariadb:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - backend
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"

    redis:
        image: redis:7-alpine
        container_name: immoware-hub-redis
        restart: unless-stopped
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --requirepass
            - ${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}
        volumes:
            - redis:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            interval: 10s
            timeout: 5s
            retries: 10
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        networks:
            - backend
        logging:
            driver: json-file
            options:
                max-size: "20m"
                max-file: "5"

volumes:
    mariadb:
    redis:
    storage:
    imports:

networks:
    backend:
        driver: bridge
