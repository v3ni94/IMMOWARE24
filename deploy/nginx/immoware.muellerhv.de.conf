# Immoware Hub, nginx auf dem Host (Betrieb ohne Docker). Ablage: /etc/nginx/sites-available/immoware.muellerhv.de.conf
# TLS-Zertifikat (z. B. Let's Encrypt via certbot) liegt ausserhalb des Repositories.
# php-fpm Pool: Unix-Socket /run/php/php8.4-fpm-immoware.sock (Pool-Datei siehe docs/operations/01-deployment.md).

upstream immoware_fpm {
    server unix:/run/php/php8.4-fpm-immoware.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name immoware.muellerhv.de;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name immoware.muellerhv.de;

    ssl_certificate     /etc/letsencrypt/live/immoware.muellerhv.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immoware.muellerhv.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:immoware_ssl:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/immoware-hub/current/public;
    index index.php;

    server_tokens off;
    client_max_body_size 34m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/immoware.muellerhv.de.access.log;
    error_log  /var/log/nginx/immoware.muellerhv.de.error.log warn;

    location ~ ^/(health|up)(/|$) {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_pass immoware_fpm;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage|vendor)/ { deny all; }
}
