# Immoware Hub, Mail- und Vorgangsbearbeitung: nginx auf dem Host (Betrieb ohne Docker).
# Ablage: /etc/nginx/sites-available/mail.muellerhv.de.conf, Leitdokument docs/mail/09-deployment.md Abschnitt 3.
# Gleiche Anwendung und gleicher php-fpm-Pool wie immoware.muellerhv.de; die Anwendung bindet die Mail-Routen an den
# Hostnamen (Route::domain), Sitzungen sind hostgebunden (SESSION_DOMAIN leer). Kein MX, kein SPF, kein DKIM, kein
# DMARC: der Hostname empfaengt keine E-Mail, Gmail bleibt das Mailsystem.
# TLS-Zertifikat (z. B. Let's Encrypt via certbot) liegt ausserhalb des Repositories.
# Der Upstream immoware_fpm ist in immoware.muellerhv.de.conf definiert; beide Dateien gehoeren in denselben nginx.

server {
    listen 80;
    listen [::]:80;
    server_name mail.muellerhv.de;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.muellerhv.de;

    ssl_certificate     /etc/letsencrypt/live/mail.muellerhv.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.muellerhv.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:mail_ssl:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/immoware-hub/current/public;
    index index.php;

    server_tokens off;
    # Pub/Sub-Push und Formulare sind klein; Anhaenge kommen ueber die Gmail-API, nicht ueber Uploads.
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Sanitisiertes Mail-HTML wird inline gerendert; externe Bilder sind durch den HtmlSanitizer bereits Platzhalter.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: cid:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'" always;

    access_log /var/log/nginx/mail.muellerhv.de.access.log;
    error_log  /var/log/nginx/mail.muellerhv.de.error.log warn;

    location ~ ^/(health|up)(/|$) {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # Pub/Sub-Push (POST /mail/gmail/push[/{token}]): kein Zugriffslog des Tokens, JWT-Pruefung in der Anwendung.
    location ^~ /mail/gmail/push {
        access_log off;
        limit_except POST { deny all; }
        try_files /index.php?$query_string /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; return 200 "User-agent: *\nDisallow: /\n"; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_pass immoware_fpm;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage|vendor)/ { deny all; }
}
