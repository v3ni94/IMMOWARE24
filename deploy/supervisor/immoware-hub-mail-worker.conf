; Immoware Hub, Mail- und Vorgangsbearbeitung: Queue-Worker unter supervisord (Betrieb ohne Docker).
; Ablage: /etc/supervisor/conf.d/immoware-hub-mail-worker.conf
; Danach: supervisorctl reread && supervisorctl update && supervisorctl start immoware-hub-mail-worker-high:* immoware-hub-mail-worker:*
; Nach jedem Deploy genuegt "php artisan queue:restart" (deploy.sh).
; Leitdokument: docs/mail/09-deployment.md Abschnitt 4. Der bestehende Hub-Worker (immoware-hub-worker.conf) bleibt unveraendert.

; Eigener Prozess nur fuer mail-high: Notfalleskalation, SLA-Pruefung, freigegebene Aktionen. Nie hinter Massenimport warten.
[program:immoware-hub-mail-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/immoware-hub/current/artisan queue:work redis --queue=mail-high --sleep=1 --tries=1 --max-time=3600 --memory=256 --timeout=300
directory=/var/www/immoware-hub/current
user=immoware
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=330
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/immoware-hub/mail-worker-high.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",LANG="C.UTF-8"

; Import und Abgleich (mail-sync) sowie KI-Vorschlaege (mail-ai). Reihenfolge der Queues = Prioritaet.
[program:immoware-hub-mail-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/immoware-hub/current/artisan queue:work redis --queue=mail-sync,mail-ai --sleep=3 --tries=1 --max-time=3600 --memory=256 --timeout=600
directory=/var/www/immoware-hub/current
user=immoware
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=630
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/immoware-hub/mail-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",LANG="C.UTF-8"
