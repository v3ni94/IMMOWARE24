; Immoware Hub, Queue-Worker unter supervisord (Betrieb ohne Docker).
; Ablage: /etc/supervisor/conf.d/immoware-hub-worker.conf
; Danach: supervisorctl reread && supervisorctl update && supervisorctl start immoware-hub-worker:*
; Nach jedem Deploy genuegt "php artisan queue:restart" (deploy.sh), supervisord startet die Prozesse neu.

[program:immoware-hub-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/immoware-hub/current/artisan queue:work redis --queue=high,default,sync,write,documents,low --sleep=3 --tries=1 --max-time=3600 --memory=256 --timeout=1800
directory=/var/www/immoware-hub/current
user=immoware
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=1830
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/immoware-hub/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",LANG="C.UTF-8"
