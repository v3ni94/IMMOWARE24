# Immoware Hub, Continuous Integration.
# Jobs: Qualitaet (composer validate, audit, Pint, PHPStan), Tests mit SQLite in-memory, Tests gegen MariaDB.
# PHPStan wird nur im CI-Job installiert (composer require --dev), nicht in composer.json des Repositories,
# weil die Entwicklungsumgebung keine GitHub-Downloads erlaubt (CLAUDE.md Regel 8).

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  PHPSTAN_VERSION: "2.2.13"
  PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, intl, bcmath, redis

jobs:
  quality:
    name: Qualitaet (validate, audit, pint, phpstan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: composer validate
        run: composer validate --strict --no-check-publish

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: composer audit
        run: composer audit --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan installieren (nur im CI, Version gepinnt)
        run: composer require --dev --no-interaction --no-progress --no-scripts --with-all-dependencies "phpstan/phpstan:${PHPSTAN_VERSION}"

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests-sqlite:
    name: Tests (SQLite in-memory)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Umgebung
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Migrationen gegen SQLite
        run: php artisan migrate:fresh --env=testing --force --no-interaction
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Tests
        run: php artisan test --no-interaction

  tests-mariadb:
    name: Tests (MariaDB 11)
    runs-on: ubuntu-latest
    needs: quality
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: immoware_hub_test
          MARIADB_USER: hub
          MARIADB_PASSWORD: hub_ci_only
          MARIADB_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: immoware_hub_test
      DB_USERNAME: hub
      DB_PASSWORD: hub_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Composer-Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: composer install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Umgebung
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: migrate:fresh gegen MariaDB
        run: php artisan migrate:fresh --force --no-interaction

      - name: Rollback-Probe (letzter Batch) und erneute Migration
        run: |
          php artisan migrate:rollback --force --no-interaction
          php artisan migrate --force --no-interaction

      - name: Integritaets-Trigger vorhanden (docs/architecture/03-mariadb-triggers.sql)
        # migrate:fresh oben lief mit HUB_DB_TRIGGERS=true (Standard). Die vier Trigger muessen existieren.
        run: |
          count="$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\DB::table("information_schema.TRIGGERS")->where("TRIGGER_SCHEMA", "immoware_hub_test")->whereIn("TRIGGER_NAME", ["audit_logs_no_update", "audit_logs_no_delete", "write_operations_guard_insert", "write_operations_guard_update"])->count();')"
          echo "Trigger: $count"
          test "$count" = "4"

      - name: Tests gegen MariaDB
        # phpunit.xml setzt SQLite ohne force; die Job-Umgebung hat Vorrang. Zur Sicherheit wird die
        # Testkonfiguration zusaetzlich explizit auf MariaDB gedreht (nur im CI-Arbeitsverzeichnis).
        # HUB_DB_TRIGGERS=false: RefreshDatabase migriert neu; Tests in Security und Admin simulieren
        # Manipulationen an audit_logs (AuditChainTest, AuditTest), die der Trigger in Produktion abweist.
        env:
          HUB_DB_TRIGGERS: "false"
        run: |
          sed -i 's#<env name="DB_CONNECTION" value="sqlite"/>#<env name="DB_CONNECTION" value="mariadb"/>#' phpunit.xml
          sed -i 's#<env name="DB_DATABASE" value=":memory:"/>#<env name="DB_DATABASE" value="immoware_hub_test"/>#' phpunit.xml
          php artisan test --no-interaction
